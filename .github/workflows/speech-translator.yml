name: speech-translator APK

on:
  push:
    paths:
      - "speech-translator/**"
      - ".github/workflows/speech-translator.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No gradle-wrapper.jar is committed; pin the Gradle version here instead.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle assembleDebug
        working-directory: speech-translator

      - uses: actions/upload-artifact@v4
        with:
          name: speech-translator-debug-apk
          path: speech-translator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
